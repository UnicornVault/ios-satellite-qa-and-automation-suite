name: DemoApp
options:
  bundleIdPrefix: io.unicornvault
  deploymentTarget:
    iOS: "17.0"

targets:
  DemoApp:
    type: application
    platform: iOS
    sources:
      - Sources/DemoApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.unicornvault.demoapp
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"

  DemoAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests/LoginTests.swift
      - UITests/Helpers/LoginHelper.swift
      - UITests/Satellite/SatelliteTests.swift
    dependencies:
      - target: DemoApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.unicornvault.demoapp.uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        TEST_TARGET_NAME: DemoApp

schemes:
  DemoApp:
    build:
      targets:
        DemoApp: all
        DemoAppUITests: [test]
    test:
      targets:
        - DemoAppUITests
