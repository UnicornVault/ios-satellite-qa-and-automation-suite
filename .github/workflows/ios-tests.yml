name: iOS UI Tests

on:
  workflow_dispatch:
    inputs:
      suite:
        description: 'Which suite to run'
        required: true
        default: 'smoke'
        type: choice
        options:
          - smoke
          - full-regression

jobs:
  smoke:
    if: github.event.inputs.suite == 'smoke'
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Run Smoke Test Plan
        run: |
          xcodebuild test \
            -project YourApp.xcodeproj \
            -scheme YourApp \
            -testPlan Smoke \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            -resultBundlePath SmokeResults.xcresult

      - name: Upload smoke results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-results
          path: SmokeResults.xcresult

  full-regression:
    if: github.event.inputs.suite == 'full-regression'
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Run Full Regression Test Plan
        run: |
          xcodebuild test \
            -project YourApp.xcodeproj \
            -scheme YourApp \
            -testPlan FullRegression \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            -resultBundlePath FullResults.xcresult

      - name: Upload full regression results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-regression-results
          path: FullResults.xcresult
