name: iOS UI Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Full regression suite runs nightly at 6am UTC, independent of PR activity
    - cron: '0 6 * * *'
  workflow_dispatch:
    # Manual trigger — lets you kick off a run on demand (e.g. via the
    # hotkey/CLI setup) without waiting for a push or the nightly schedule.
    inputs:
      suite:
        description: 'Which suite to run'
        required: true
        default: 'smoke'
        type: choice
        options:
          - smoke
          - full-regression

jobs:
  smoke:
    # Fast, critical-path subset — runs on every push/PR, or on manual
    # dispatch when "smoke" is selected.
    if: github.event_name == 'push' || github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.event.inputs.suite == 'smoke')
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Run Smoke Test Plan
        run: |
          xcodebuild test \
            -project YourApp.xcodeproj \
            -scheme YourApp \
            -testPlan Smoke \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            -resultBundlePath SmokeResults.xcresult

      - name: Upload smoke results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-results
          path: SmokeResults.xcresult

  full-regression:
    # Complete suite across all genres — runs nightly, or on manual
    # dispatch when "full-regression" is selected.
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.suite == 'full-regression')
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Run Full Regression Test Plan
        run: |
          xcodebuild test \
            -project YourApp.xcodeproj \
            -scheme YourApp \
            -testPlan FullRegression \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            -resultBundlePath FullResults.xcresult

      - name: Upload full regression results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-regression-results
          path: FullResults.xcresult
