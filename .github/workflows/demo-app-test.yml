name: Demo App — Proof of Concept

# This workflow is separate from the main ios-tests.yml suite. It exists
# to prove the test-writing approach actually works end to end: a real
# SwiftUI app, built and tested on a free GitHub-hosted macOS runner,
# with results visible in the Actions tab — no local Mac required.
#
# Scope: LoginTests.swift (3 tests) and SatelliteTests.swift (17 tests,
# the flagship genre) now run against real screens in DemoApp. The
# remaining genres are written against a hypothetical app's expected UI
# and are not yet backed by real screens.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  demo-app-test:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: List available simulators (debug visibility)
        run: xcrun simctl list devices available

      - name: Find an available iPhone simulator
        id: simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for runtime, devices in data['devices'].items():
              if 'iOS' in runtime:
                  for d in devices:
                      if d['name'].startswith('iPhone'):
                          print(d['udid'])
                          sys.exit(0)
          sys.exit(1)
          ")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Selected simulator UDID: $UDID"

      - name: Run LoginTests + SatelliteTests against DemoApp
        run: |
          xcodebuild test \
            -project DemoApp.xcodeproj \
            -scheme DemoApp \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -resultBundlePath DemoAppResults.xcresult

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-app-test-results
          path: DemoAppResults.xcresult
