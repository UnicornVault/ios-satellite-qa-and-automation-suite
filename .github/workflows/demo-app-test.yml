name: Demo App — Proof of Concept

# This workflow is separate from the main ios-tests.yml suite. It exists
# to prove the test-writing approach actually works end to end: a real
# SwiftUI app, built and tested on a free GitHub-hosted macOS runner,
# with results visible in the Actions tab — no local Mac required.
#
# Scope: LoginTests.swift (3 tests) and SatelliteTests.swift (17 tests,
# the flagship genre) now run against real screens in DemoApp. The
# remaining genres are written against a hypothetical app's expected UI
# and are not yet backed by real screens.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  demo-app-test:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: List available simulators (debug visibility)
        run: xcrun simctl list devices available

      - name: Find an available iPhone simulator
        id: simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for runtime, devices in data['devices'].items():
              if 'iOS' in runtime:
                  for d in devices:
                      if d['name'].startswith('iPhone'):
                          print(d['udid'])
                          sys.exit(0)
          sys.exit(1)
          ")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Selected simulator UDID: $UDID"

      - name: Run LoginTests + SatelliteTests against DemoApp
        id: run_tests
        run: |
          # Retries automatically handle transient CI flakiness (simulator
          # boot timing, momentary resource contention) — NOT actual code
          # bugs. A real logic bug will fail identically on every retry,
          # which is itself useful diagnostic information.
          max_attempts=2
          attempt=1
          until [ $attempt -gt $max_attempts ]; do
            echo "Attempt $attempt of $max_attempts"
            if xcodebuild test \
              -project DemoApp.xcodeproj \
              -scheme DemoApp \
              -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
              -resultBundlePath DemoAppResults.xcresult; then
              echo "Tests passed on attempt $attempt"
              exit 0
            fi
            echo "Attempt $attempt failed"
            attempt=$((attempt + 1))
            rm -rf DemoAppResults.xcresult
          done
          echo "All $max_attempts attempts failed — this is likely a real bug, not flakiness."
          echo "See docs/EXIT_CODES.md for how to diagnose the specific exit code."
          exit 1

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-app-test-results
          path: DemoAppResults.xcresult
          if-no-files-found: ignore

      - name: Install xcparse
        if: always()
        run: brew install chargepoint/xcparse/xcparse

      - name: Extract screenshots from test results
        if: always()
        run: |
          mkdir -p screenshots
          xcparse screenshots DemoAppResults.xcresult screenshots/ || echo "No screenshots to extract"

      - name: Upload screenshots (viewable images)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-screenshots
          path: screenshots/
          if-no-files-found: ignore
