name: Demo App — Proof of Concept

# This workflow is separate from the main ios-tests.yml suite. It exists
# to prove the test-writing approach actually works end to end: a real
# SwiftUI app, built and tested on a free GitHub-hosted macOS runner,
# with results visible in the Actions tab — no local Mac required.
#
# Scope is intentionally small: just LoginTests.swift against DemoApp.
# The other 108 tests in this repo are written against a hypothetical
# app's expected UI and are not (yet) backed by a real running app.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  demo-app-test:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Run LoginTests against DemoApp
        run: |
          xcodebuild test \
            -project DemoApp.xcodeproj \
            -scheme DemoApp \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            -resultBundlePath DemoAppResults.xcresult

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-app-test-results
          path: DemoAppResults.xcresult
